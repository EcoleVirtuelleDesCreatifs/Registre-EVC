# Exemple de configuration Nginx (VPS) — remplacez le domaine et le chemin
server {
    listen 80;
    server_name verification.ecolevirtuelledescreatifs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name verification.ecolevirtuelledescreatifs.com;
    root /var/www/evc-registre/public;

    ssl_certificate     /etc/letsencrypt/live/verification.ecolevirtuelledescreatifs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verification.ecolevirtuelledescreatifs.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    index index.php;
    charset utf-8;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.png { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
